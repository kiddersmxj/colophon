[project]
name = "colophon"
version = "0.1.0"
description = "The short how-to for each of your services, programs and devices."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# The CLI is the standard library only, so it runs on any machine's python.
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pillow>=10",
    "cairosvg>=2.7",
]
dev = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pillow>=10",
    "cairosvg>=2.7",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
colophon = "colophon.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["colophon*"]

[tool.setuptools.package-data]
"colophon.server" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["colophon", "conftest"]
